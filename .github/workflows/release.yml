name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quality gate: run tests and analysis before building release artifacts
  test:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned for supply-chain safety
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Check coverage threshold
        run: |
          # Parse lcov.info and calculate line coverage percentage.
          TOTAL_LINES=$(grep -c "^DA:" coverage/lcov.info || echo 0)
          HIT_LINES=$(grep "^DA:" coverage/lcov.info | grep -v ",0$" | wc -l || echo 0)
          if [ "$TOTAL_LINES" -eq 0 ]; then
            echo "::error::No coverage data found"
            exit 1
          fi
          COVERAGE=$((HIT_LINES * 100 / TOTAL_LINES))
          echo "Coverage: ${COVERAGE}% (${HIT_LINES}/${TOTAL_LINES} lines)"
          if [ "$COVERAGE" -lt 70 ]; then
            echo "::error::Coverage ${COVERAGE}% is below 70% threshold"
            exit 1
          fi

  build-release-android:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('android/build.gradle.kts', 'pubspec.lock') }}
          restore-keys: |
            gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Require signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is required for release builds"
            exit 1
          fi

      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/release-keystore.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if [[ "$TAG" == *"+"* ]]; then
            BUILD_NAME="${TAG%%+*}"
            BUILD_NUMBER="${TAG##*+}"
          else
            BUILD_NAME="$TAG"
            BUILD_NUMBER="${{ github.run_number }}"
          fi
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build release AAB
        # Task 10.1 — pass SENTRY_DSN as dart-define so release
        # builds phone home with crash reports when the secret is set.
        # When the secret is empty the dart-define resolves to '' and
        # main.dart's SentryFlutter.init is short-circuited — no
        # events ship, no errors thrown.
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info --build-name=${{ steps.version.outputs.build_name }} --build-number=${{ steps.version.outputs.build_number }} --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks

      - name: Cleanup keystore
        if: always()
        run: rm -f release-keystore.jks

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: build/app/outputs/bundle/release/*.aab
          generate_release_notes: true

  build-release-ios:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Parse version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if [[ "$TAG" == *"+"* ]]; then
            BUILD_NAME="${TAG%%+*}"
            BUILD_NUMBER="${TAG##*+}"
          else
            BUILD_NAME="$TAG"
            BUILD_NUMBER="${{ github.run_number }}"
          fi
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Build iOS (no codesign)
        # Task 10.1 — iOS half of the SENTRY_DSN pipe. Same semantics
        # as the Android build above; empty secret → inert Sentry.
        run: flutter build ios --no-codesign --release --obfuscate --split-debug-info=build/debug-info --build-name=${{ steps.version.outputs.build_name }} --build-number=${{ steps.version.outputs.build_number }} --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-ios-build
          path: build/ios/iphoneos/Runner.app
          retention-days: 90
