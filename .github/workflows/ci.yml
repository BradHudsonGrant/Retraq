name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned for supply-chain safety
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Task 10.3 — assert .fvmrc matches the CI-pinned Flutter version so
      # developers using FVM cannot drift from CI without noticing.
      - name: Verify .fvmrc matches CI Flutter version
        run: |
          CI_VERSION='3.41.6'
          FVMRC_VERSION=$(grep -oE '"flutter"\s*:\s*"[^"]+"' .fvmrc | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$FVMRC_VERSION" != "$CI_VERSION" ]; then
            echo "::error::.fvmrc pins Flutter $FVMRC_VERSION but CI uses $CI_VERSION."
            echo "Update app/.fvmrc to match."
            exit 1
          fi

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format generated code
        run: dart format $(find . -name '*.g.dart' -o -name '*.freezed.dart' -o -name '*.gen.dart')

      # Task 10.9 — fail loud if an ARB edit wasn't followed by
      # `flutter gen-l10n`. `pub get` above already triggers l10n
      # codegen when l10n.yaml is present, so any diff here means the
      # checked-in app_localizations*.dart files are stale relative
      # to the .arb source of truth. The diff is printed so reviewers
      # can see exactly what's out of sync.
      - name: Regenerate l10n and fail on drift
        shell: bash
        run: |
          set -euo pipefail
          flutter gen-l10n
          if ! git diff --quiet -- lib/l10n ; then
            echo "::error::Stale l10n output. Run 'flutter gen-l10n' locally and commit the result."
            git --no-pager diff -- lib/l10n
            exit 1
          fi

      # Task 7.18 — AppMotion bypass lint. Fails the build if any
      # file under lib/screens/ or lib/widgets/ declares an
      # AnimationController WITHOUT referencing one of the
      # reduce-motion guard names (AppMotion, disableAnimations,
      # reduceMotion). Catches the regression class where a
      # contributor adds a new animation without honouring the
      # user's reduce-motion preference (WCAG 2.3.3 / 2.2.2).
      #
      # The guard-name heuristic is intentional: accept EITHER
      # AppMotion.reduce(context) OR a direct MediaQuery
      # .disableAnimations check — both are legitimate paths.
      - name: AppMotion bypass lint
        shell: bash
        run: |
          set -euo pipefail
          files=$(grep -rln 'AnimationController(' \
            lib/screens/ lib/widgets/ 2>/dev/null || true)
          bad=""
          for f in $files; do
            if ! grep -qE 'AppMotion|disableAnimations|reduceMotion' "$f"; then
              bad="$bad\n$f"
            fi
          done
          if [ -n "$bad" ]; then
            echo "::error::AnimationController without a reduce-motion guard:"
            echo -e "$bad"
            echo ""
            echo "Every animation in lib/screens/ or lib/widgets/ must be"
            echo "gated through AppMotion.reduce(context), AppMotion.aware(),"
            echo "or a direct MediaQuery.disableAnimations check."
            exit 1
          fi

      # Task 12.5 — forbidden-claims lint. Fails the build if
      # eight banned health claim terms appear in shipping
      # surfaces: lib/ (minus the disclaimer files that use the
      # terms in negated form), docs/store-listing/ (minus the
      # two meta-docs that document the blocklist itself),
      # docs/gtm/ (minus ai-non-claims.md), and assets/.
      #
      # Internal engineering / planning docs (docs/plans/,
      # docs/legal/, docs/brand/, docs/sessions/) are NOT
      # scanned — they legitimately reference the terms when
      # documenting the policy, and scanning them creates
      # false-positive churn without any shipping-surface
      # protection benefit.
      #
      # See docs/legal/forbidden-claims.md for rationale +
      # exemption process.
      - name: Forbidden-claims lint
        shell: bash
        run: |
          set -euo pipefail
          if rg -i \
               -e '\bcures?\b' \
               -e '\btreats?\b' \
               -e '\btreating\b' \
               -e '\bdiagnoses?\b' \
               -e '\bdiagnosing\b' \
               -e '\bFDA[- ]approved\b' \
               -e '\bHIPAA[- ]compliant\b' \
               -e '\bclinically proven\b' \
               --glob '!lib/legal/terms_of_service.dart' \
               --glob '!lib/legal/health_disclaimer.dart' \
               --glob '!docs/gtm/ai-non-claims.md' \
               --glob '!docs/store-listing/health-claim-guardrails.md' \
               --glob '!docs/store-listing/categories-and-health-declaration.md' \
               lib/ assets/ docs/gtm/ docs/store-listing/; then
            echo "::error::Forbidden health-claim term detected. See docs/legal/forbidden-claims.md"
            exit 1
          fi

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      # Task 6.12 — PR lane runs unit + widget tests only, skipping
      # anything tagged `integration` in dart_test.yaml. Integration
      # tests run separately in the dedicated integration lane
      # (integration-test job below).
      - name: Run unit + widget tests
        run: flutter test --exclude-tags integration --coverage

      - name: Check coverage threshold
        run: |
          # Strip generated files from coverage before calculating.
          grep -v -E '\.g\.dart|\.freezed\.dart|\.gen\.dart|app_localizations' coverage/lcov.info > coverage/lcov_filtered.info || true

          # Parse lcov_filtered.info and calculate line coverage percentage.
          TOTAL_LINES=$(grep -c "^DA:" coverage/lcov_filtered.info || echo 0)
          HIT_LINES=$(grep "^DA:" coverage/lcov_filtered.info | grep -v ",0$" | wc -l || echo 0)
          if [ "$TOTAL_LINES" -eq 0 ]; then
            echo "::error::No coverage data found"
            exit 1
          fi
          COVERAGE=$((HIT_LINES * 100 / TOTAL_LINES))
          echo "Coverage: ${COVERAGE}% (${HIT_LINES}/${TOTAL_LINES} lines)"
          if [ "$COVERAGE" -lt 45 ]; then
            echo "::error::Coverage ${COVERAGE}% is below 45% threshold"
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/

      # Task 10.8 — upload filtered LCOV to Codecov so the committed
      # codecov.yml 70% patch gate actually runs. CODECOV_TOKEN lives
      # in GitHub Secrets; fail_ci_if_error stays false so Codecov
      # outages don't block merges. Uses the filtered LCOV (generated
      # files stripped above) to match the in-CI threshold calculation.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@ad3126e916f78f00edff4ed0317cf185271ccc2d # v5.4.2
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov_filtered.info
          fail_ci_if_error: false
          verbose: true

  # Task 6.20 — supply-chain pin audit. All GitHub Actions in this
  # file (and release.yml) must be SHA-pinned, never '@v1' or '@main'.
  # A supply-chain attack on an unpinned action could inject arbitrary
  # code into our release binary. This job fails loud if anyone
  # accidentally introduces an unpinned ref.
  ci-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify all Actions are SHA-pinned
        shell: bash
        run: |
          set -euo pipefail
          # Match `uses: vendor/action@<ref>` lines. An unpinned ref is
          # anything that doesn't look like a 40-char hex SHA — semver
          # tags (@v1, @v4.2.2), branch names (@main), or relative
          # paths all fail the check.
          violations=$(grep -rnE '^\s*(-\s+)?uses:\s+[^@]+@[^# ]+' \
            .github/workflows/ | \
            grep -vE '@[0-9a-f]{40}' || true)
          if [ -n "$violations" ]; then
            echo "::error::Unpinned GitHub Action(s) detected — SHA-pin required."
            echo "$violations"
            echo ""
            echo "Replace '@v1' / '@main' with the full 40-char commit SHA."
            echo "Keep the '# vX.Y.Z' trailing comment so humans can read it."
            exit 1
          fi
          echo "All Actions are SHA-pinned."

  # Smoke build: debug-signed AAB on every push so we catch release-mode
  # issues (ProGuard, desugaring, R8) early. Real signed releases happen
  # via release.yml on tag push — that workflow enforces KEYSTORE_BASE64.
  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('android/build.gradle.kts', 'pubspec.lock') }}
          restore-keys: |
            gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # No keystore in CI — build.gradle.kts falls through to debug signing.
      # This produces an installable AAB that cannot be uploaded to Play Store
      # (by design). release.yml handles real signing on tag push.
      - name: Build release AAB (debug-signed)
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info

      - name: Upload AAB artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 14

  # Smoke build: unsigned iOS .app so we catch CocoaPods/Swift issues early.
  # TestFlight and App Store builds happen via release.yml on tag push.
  build-ios:
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (no codesign)
        run: flutter build ios --no-codesign --release

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app
          retention-days: 14

  # Integration tests on an Android emulator.
  # Runs after unit tests pass. Uses reactivecircus/android-emulator-runner.
  integration-test:
    if: false # Disabled until needed
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 34
          arch: x86_64
          script: flutter test integration_test/
