name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned for supply-chain safety
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Format generated code
        run: dart format $(find . -name '*.g.dart' -o -name '*.freezed.dart' -o -name '*.gen.dart')

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Check coverage threshold
        run: |
          # Strip generated files from coverage before calculating.
          grep -v -E '\.g\.dart|\.freezed\.dart|\.gen\.dart|app_localizations' coverage/lcov.info > coverage/lcov_filtered.info || true

          # Parse lcov_filtered.info and calculate line coverage percentage.
          TOTAL_LINES=$(grep -c "^DA:" coverage/lcov_filtered.info || echo 0)
          HIT_LINES=$(grep "^DA:" coverage/lcov_filtered.info | grep -v ",0$" | wc -l || echo 0)
          if [ "$TOTAL_LINES" -eq 0 ]; then
            echo "::error::No coverage data found"
            exit 1
          fi
          COVERAGE=$((HIT_LINES * 100 / TOTAL_LINES))
          echo "Coverage: ${COVERAGE}% (${HIT_LINES}/${TOTAL_LINES} lines)"
          if [ "$COVERAGE" -lt 45 ]; then
            echo "::error::Coverage ${COVERAGE}% is below 45% threshold"
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-report
          path: coverage/

  # Smoke build: debug-signed AAB on every push so we catch release-mode
  # issues (ProGuard, desugaring, R8) early. Real signed releases happen
  # via release.yml on tag push — that workflow enforces KEYSTORE_BASE64.
  build-android:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Cache Gradle
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('android/build.gradle.kts', 'pubspec.lock') }}
          restore-keys: |
            gradle-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # No keystore in CI — build.gradle.kts falls through to debug signing.
      # This produces an installable AAB that cannot be uploaded to Play Store
      # (by design). release.yml handles real signing on tag push.
      - name: Build release AAB (debug-signed)
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info

      - name: Upload AAB artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 14

  # Smoke build: unsigned iOS .app so we catch CocoaPods/Swift issues early.
  # TestFlight and App Store builds happen via release.yml on tag push.
  build-ios:
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build iOS (no codesign)
        run: flutter build ios --no-codesign --release

      - name: Upload iOS build artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ios-build
          path: build/ios/iphoneos/Runner.app
          retention-days: 14

  # Integration tests on an Android emulator.
  # Runs after unit tests pass. Uses reactivecircus/android-emulator-runner.
  integration-test:
    if: false # Disabled until needed
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 34
          arch: x86_64
          script: flutter test integration_test/
