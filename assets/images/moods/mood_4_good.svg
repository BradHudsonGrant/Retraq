<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Good = droplet blob. Silhouette: clearly taller than wide with a
       rounded dome and a narrower base, like a drop that's landed. Reads
       "lifted" without going full sparkle (that's reserved for mood 5). -->
  <path d="M24 4 C30 4, 36 11, 36 22 C36 34, 31 41, 24 41 C17 41, 12 34, 12 22 C12 11, 18 4, 24 4Z" fill="currentColor"/>
  <!-- Bright upturned crescent eyes — the "happy squint". -->
  <path d="M16 22 Q19 19, 22 22" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.95"/>
  <path d="M26 22 Q29 19, 32 22" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.95"/>
  <!-- Clear smile. -->
  <path d="M18 28 Q24 33, 30 28" stroke="white" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.95"/>
  <!-- Rosy cheek highlights to make the shape clearly different from mood 3. -->
  <circle cx="15" cy="28" r="1.6" fill="white" opacity="0.4"/>
  <circle cx="33" cy="28" r="1.6" fill="white" opacity="0.4"/>
</svg>
