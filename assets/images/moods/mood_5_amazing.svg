<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Amazing: the peak mood. Now rendered as a plump, full-bodied
       blob that visibly fills more of the viewBox than the
       downstream states. Proportions are essentially circular with
       a soft slightly-taller-than-wide bias, so the character reads
       as "the same blob, but at its fullest / most buoyant" rather
       than "stretched upward". No face, no accents — the generous
       rounded mass alone carries the peak-mood read. -->
  <path d="M24 3
           C33 3, 41 10, 41 20
           C41 28, 39 34, 36 38
           C33 42, 29 44, 24 44
           C19 44, 15 42, 12 38
           C9 34, 7 28, 7 20
           C7 10, 15 3, 24 3Z"
        fill="currentColor"/>
</svg>
